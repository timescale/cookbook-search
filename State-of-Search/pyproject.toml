[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "state-of-search-demo"
version = "0.1.0"
description = "A narrative comparison of PostgreSQL-native and Elasticsearch search"
requires-python = ">=3.11"
dependencies = [
  "elasticsearch>=9.0,<10",
  "openai>=1.0,<3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.40,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
